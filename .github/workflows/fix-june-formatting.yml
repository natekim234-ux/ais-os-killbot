name: Fix June Tab Formatting (one-time)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node fix-june-formatting.mjs
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
