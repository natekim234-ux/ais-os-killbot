name: Hushlab Killbot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Override DRY_RUN (leave empty to use repo variable)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node killbot.mjs
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          # Optional 2nd Hushlab ad account (same product/creative, e.g. the
          # account-level CPM test account). Bot loops both when this is set.
          META_AD_ACCOUNT_ID_2: ${{ secrets.META_AD_ACCOUNT_ID_2 }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
